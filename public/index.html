<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shabeel Kandi</title>
<meta name="description" content="Side projects by Shabeel Kandi, one page each.">
<style>
:root { --bg: #fbfbf8; --ink: #151a24; --muted: #7a808d; --rule: #dedcd3; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111317; --ink: #ebeae3; --muted: #878b94; --rule: #2a2e36; color-scheme: dark; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  padding: 0 16px;
}
main { max-width: 640px; margin: 0 auto; padding: 72px 0 96px; }
h1 { font-size: 17px; font-weight: 600; margin: 0 0 40px; }
ol { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--rule); }
li { border-top: 1px solid var(--rule); }
li a {
  display: grid; grid-template-columns: 8.5em 1fr; gap: 0 16px;
  padding: 12px 0; color: inherit; text-decoration: none;
}
li a:hover span, li a:focus-visible span { text-decoration: underline; text-underline-offset: 3px; }
li a:focus-visible { outline: 2px solid var(--muted); outline-offset: 4px; }
time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 480px) {
  li a { grid-template-columns: 1fr; gap: 2px; }
  time { font-size: 14px; }
}
</style>
</head>
<body>
<main>
  <h1>Shabeel Kandi</h1>
  <ol>
    <li><a href="/industry-cycle-map/"><time datetime="2026-10-31">31 Oct 2026</time><span>Industry Cycle Map</span></a></li>
  </ol>
</main>
</body>
</html>
